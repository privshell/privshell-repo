<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">PrivShell Modules Repo</title>
  <desc id="d">Root modules with real WebUIs for KernelSU, KernelSU Next, APatch and Magisk.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#8b9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c4ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#05060a"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowB)"/>
  <rect y="440" width="1280" height="200" fill="url(#fade)"/>

  <!-- top rule -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#brand)"/>

  <!-- logo glyph -->
  <g transform="translate(80 84)">
    <polygon points="48,0 90,24 90,72 48,96 6,72 6,24" fill="#22d3ee" opacity="0.28" filter="url(#soft)"/>
    <polygon points="48,0 90,24 90,72 48,96 6,72 6,24" fill="#0a0d16" stroke="url(#brand)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="48,14 78,31 78,65 48,82 18,65 18,31" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <text x="48" y="62" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-weight="700" font-size="40" fill="url(#brand)">&gt;_</text>
  </g>

  <!-- wordmark -->
  <text x="76" y="290" font-family="Inter, 'DejaVu Sans', sans-serif" font-weight="800" font-size="102" letter-spacing="3" fill="url(#title)">PRIVSHELL</text>
  <text x="82" y="342" font-family="'DejaVu Sans Mono', monospace" font-weight="700" font-size="26" letter-spacing="13" fill="#22d3ee">MODULES REPO</text>

  <text x="82" y="410" font-family="Inter, 'DejaVu Sans', sans-serif" font-weight="600" font-size="30" fill="#e8ebf5">Root modules with real WebUIs.</text>
  <text x="82" y="450" font-family="Inter, 'DejaVu Sans', sans-serif" font-weight="400" font-size="22" fill="#8b93a7">Built, tested and shipped from one place.</text>

  <!-- compatibility chips -->
  <g font-family="'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#cfd5e6">
    <g transform="translate(82 500)">
      <rect width="118" height="38" rx="19" fill="#0b0e16" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="59" y="25" text-anchor="middle">KernelSU</text>
    </g>
    <g transform="translate(212 500)">
      <rect width="164" height="38" rx="19" fill="#0b0e16" stroke="#8b9cff" stroke-opacity="0.55"/>
      <text x="82" y="25" text-anchor="middle">KernelSU Next</text>
    </g>
    <g transform="translate(388 500)">
      <rect width="98" height="38" rx="19" fill="#0b0e16" stroke="#c084fc" stroke-opacity="0.55"/>
      <text x="49" y="25" text-anchor="middle">APatch</text>
    </g>
    <g transform="translate(498 500)">
      <rect width="98" height="38" rx="19" fill="#0b0e16" stroke="#f472b6" stroke-opacity="0.55"/>
      <text x="49" y="25" text-anchor="middle">Magisk</text>
    </g>
    <g transform="translate(608 500)">
      <rect width="86" height="38" rx="19" fill="#0b0e16" stroke="#34d399" stroke-opacity="0.55"/>
      <text x="43" y="25" text-anchor="middle">MMRL</text>
    </g>
  </g>

  <text x="82" y="598" font-family="'DejaVu Sans Mono', monospace" font-size="18" fill="#5d667c">privshell.github.io/privshell-repo</text>

  <!-- module cards -->
  <g font-family="'DejaVu Sans Mono', monospace">
    <g transform="translate(790 88)">
      <rect width="410" height="104" rx="16" fill="#0b0e16" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="0" y="18" width="5" height="68" rx="2.5" fill="#22d3ee"/>
      <text x="30" y="46" font-size="21" font-weight="700" fill="#ffffff">AEGIS // FIREWALL</text>
      <text x="30" y="74" font-size="15" fill="#8b93a7">Kernel-level per-app firewall</text>
      <text x="382" y="46" font-size="15" text-anchor="end" fill="#22d3ee" fill-opacity="0.8">01</text>
    </g>
    <g transform="translate(790 208)">
      <rect width="410" height="104" rx="16" fill="#0b0e16" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="0" y="18" width="5" height="68" rx="2.5" fill="#8b9cff"/>
      <text x="30" y="46" font-size="21" font-weight="700" fill="#ffffff">APEX // APPS</text>
      <text x="30" y="74" font-size="15" fill="#8b93a7">App manager with snapshot restore</text>
      <text x="382" y="46" font-size="15" text-anchor="end" fill="#8b9cff" fill-opacity="0.8">02</text>
    </g>
    <g transform="translate(790 328)">
      <rect width="410" height="104" rx="16" fill="#0b0e16" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="0" y="18" width="5" height="68" rx="2.5" fill="#c084fc"/>
      <text x="30" y="46" font-size="21" font-weight="700" fill="#ffffff">ORBIT // STORE</text>
      <text x="30" y="74" font-size="15" fill="#8b93a7">In-manager module store</text>
      <text x="382" y="46" font-size="15" text-anchor="end" fill="#c084fc" fill-opacity="0.8">03</text>
    </g>
    <g transform="translate(790 448)">
      <rect width="410" height="104" rx="16" fill="#0b0e16" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="0" y="18" width="5" height="68" rx="2.5" fill="#34d399"/>
      <text x="30" y="46" font-size="21" font-weight="700" fill="#ffffff">GIT MIGRATOR</text>
      <text x="30" y="74" font-size="15" fill="#8b93a7">GitHub backup &amp; migration</text>
      <text x="382" y="46" font-size="15" text-anchor="end" fill="#34d399" fill-opacity="0.8">04</text>
    </g>
  </g>
</svg>
